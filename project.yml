name: Vaire
options:
  bundleIdPrefix: com.martinmatousek.vaire
  deploymentTarget:
    macOS: "14.0"

packages:
  VaireKit:
    path: VaireKit

settings:
  base:
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: LG4P6Q3UG5

targets:
  VaireApp:
    type: application
    platform: macOS
    sources:
      - path: VaireApp
    dependencies:
      - package: VaireKit
      - target: VaireWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinmatousek.vaire.app
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_LSUIElement: "YES"
        ENABLE_APP_SANDBOX: "NO"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: VaireApp/Info.plist
      properties:
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.martinmatousek.vaire.block
            UTTypeDescription: Vaire Block Reference
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - vaireblock

  VaireWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: VaireWidget
    dependencies:
      - package: VaireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.martinmatousek.vaire.app.widget
        CODE_SIGN_STYLE: Automatic
    info:
      path: VaireWidget/Info.plist
      properties:
        CFBundleDisplayName: Vaire Widget
        CFBundleShortVersionString: "0.1.3"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
